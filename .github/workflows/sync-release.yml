name: 同步上游 Releases
on:
  workflow_dispatch:  # 仅手动运行（最安全）

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: 同步所有 Releases
        uses: dinkorpanda/sync-releases@main
        with:
          source-repo: SuperMonster003/AutoJs6
          github-token: ${{ secrets.GITHUB_TOKEN }}
